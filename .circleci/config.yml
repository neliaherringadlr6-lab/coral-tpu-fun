version: 2.1

jobs:
  step2_update-dashboard-bug:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: coverage pass
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/handoff/handoff.ok; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/handoff/handoff.ok; done; true
            du -h /tmp/handoff/handoff.ok
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - handoff.ok
  update-dashboard-bug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Fetch pre-step
          command: |
            test -s /tmp/handoff/handoff.ok && echo nonempty || echo empty
      - run:
          name: Checkout working tree
          command: git clone --depth 5 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress and stage
          command: gunzip -c dist-release.tgz | tar xvf -
      - run:
          name: Validate binary
          command: env | wc -l
      - run:
          no_output_timeout: 78m
          command: "$PWD/gateway"
  g2_assemble-nightly-regression-suite:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: countersink
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=25;i++){f = (i==1||i==2 ? 1 : f1+f2); f2 = f1; f1 = f}; print f}' 2>/dev/null || awk 'BEGIN{a=1;b=1;for(i=3;i<=25;i++){c=a+b;a=b;b=c}; print b}'; true ; } > /tmp/handoff/stash.bin
            du -h /tmp/handoff/stash.bin
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - stash.bin
